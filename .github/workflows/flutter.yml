name: Flutter qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
  push:
    branches: [main, 'manus/**']
    paths:
      - 'apps/mobile/**'

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Debug APK
        run: flutter build apk --debug

      - name: Release APK using safe test signing
        run: flutter build apk --release
